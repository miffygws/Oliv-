<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oliv+ care: Kill the Germs</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--purple:#5f376e;--pink:#c9589b;--lav:#f0e8fb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#f0e8fb;overflow:hidden;font-family:'Poppins',system-ui,sans-serif;color:var(--purple);-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;overflow-y:auto;text-align:center;padding:24px;background:rgba(255,255,255,.88);transition:opacity .25s}
#ui.hide{opacity:0;pointer-events:none}
#ui img{width:min(46vw,220px);height:auto;margin-bottom:14px}
h1{font-size:clamp(26px,6vw,52px);margin:0 0 8px;line-height:1.1}
p{font-size:clamp(15px,3vw,22px);margin:6px 0 22px;max-width:32ch;color:#4a2a57}
button{font:600 clamp(20px,4vw,28px) 'Poppins',system-ui,sans-serif;padding:14px 44px;border:0;border-radius:999px;background:linear-gradient(90deg,var(--pink),var(--purple));color:#fff;cursor:pointer}
button:focus-visible{outline:4px solid var(--purple);outline-offset:3px}
#lb{margin:0 0 14px;font-size:clamp(14px,2.6vw,20px)}#lb ol{list-style:none;padding:0;margin:6px auto 0;width:min(80vw,300px)}#lb li{display:flex;justify-content:space-between;gap:16px;padding:3px 12px;border-radius:8px}#lb li.me{background:#e6d9f7;font-weight:700}#nf{display:flex;gap:8px;margin:0 0 14px}#nf input{font:500 clamp(18px,3.4vw,24px) 'Poppins',system-ui,sans-serif;padding:10px 16px;border:2px solid var(--purple);border-radius:999px;width:min(46vw,200px);color:var(--purple);-webkit-user-select:text;user-select:text}#nf button{padding:10px 24px;font-size:clamp(16px,3vw,22px)}.gone{display:none!important}#lkp{font-size:clamp(12px,2.2vw,16px);margin:18px 0 0;max-width:44ch;line-height:1.4}#lk{display:inline-block;margin-top:8px;padding:8px 22px;border-radius:999px;border:2px solid var(--purple);color:var(--purple);font-weight:600;text-decoration:none}#lk:focus-visible{outline:4px solid var(--pink);outline-offset:3px}#nf{flex-wrap:wrap;justify-content:center}#nf #sk{background:#fff;color:var(--purple);border:2px solid var(--purple)}
@media (prefers-reduced-motion:reduce){#ui{transition:none}}
</style>

<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),ui=document.getElementById('ui');
const T=document.getElementById('t'),S=document.getElementById('s'),B=document.getElementById('b');
const P='#5f376e',PK='#c9589b';
let W,H,D,K;
function size(){D=window.devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*D;cv.height=H*D;g.setTransform(D,0,0,D,0,0);K=Math.min(1.2,Math.max(.7,H/650))}
addEventListener('resize',size);size();

const TIME=30,INTRO='Move with your finger, mouse or arrow keys. Hold to spray (or press space). 30 seconds!';
let state='start',germs=[],mist=[],sparks=[],score=0,lives=3,left=TIME,spawn=0,last=0,idle=null;
let wx=0,tx=0,face=1,walk=0,spraying=false,cool=0,keys={};
const gy=()=>H-36;

function start(){germs=[];mist=[];sparks=[];score=0;lives=3;left=TIME;spawn=.5;wx=tx=W/2;spraying=false;state='play';ui.classList.add('hide');clearTimeout(idle);NF.classList.add('gone');fetchGlobal()}
function end(){
  state='over';spraying=false;
  T.textContent=lives>0?'Fresh and confident!':'So close! Try again.';
  S.textContent='You killed '+score+' germ'+(score===1?'':'s')+'. Stay fresh with Oliv+ care.';
  B.textContent='Play again';
  const lb=loadLB(),q=score>0&&(lb.length<5||score>lb[lb.length-1].s);
  renderLB();
  if(q){NM.value='';NF.classList.remove('gone');B.classList.add('gone')}
  ui.classList.remove('hide');
  if(q)setTimeout(()=>NM.focus(),300);
  idle=setTimeout(showStart,q?45000:15000);
}
B.onclick=start;
const LB_KEY='oliv_care_lb',LB=document.getElementById('lb'),NF=document.getElementById('nf'),NM=document.getElementById('nm'),SV=document.getElementById('sv');
let GLB=null;
function localLB(){try{return JSON.parse(localStorage.getItem(LB_KEY))||[]}catch(e){return []}}
function loadLB(){return GLB||localLB()}
function fetchGlobal(){fetch('/api/scores',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(a=>{GLB=a;renderLB()}).catch(()=>{})}
function saveLB(a){try{localStorage.setItem(LB_KEY,JSON.stringify(a))}catch(e){}}
function renderLB(hl){LB.textContent='';const a=loadLB();if(!a.length)return;const h=document.createElement('b');h.textContent='Top players';const ol=document.createElement('ol');a.forEach((r,i)=>{const li=document.createElement('li');if(i===hl)li.className='me';const n=document.createElement('span'),s=document.createElement('span');n.textContent=(i+1)+'. '+r.n;s.textContent=r.s;li.append(n,s);ol.append(li)});LB.append(h,ol)}
function showStart(){state='start';T.textContent='Kill the germs!';S.textContent=INTRO;B.textContent='Start';NF.classList.add('gone');B.classList.remove('gone');renderLB();fetchGlobal()}
function saveScore(){const e={n:(NM.value.trim()||'Guest').slice(0,12),s:score};const a=localLB();a.push(e);a.sort((x,y)=>y.s-x.s);a.splice(5);saveLB(a);NF.classList.add('gone');B.classList.remove('gone');renderLB(loadLB().findIndex(x=>x.n===e.n&&x.s===e.s));clearTimeout(idle);idle=setTimeout(showStart,15000);
  fetch('/api/scores',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(e)}).then(r=>r.ok?r.json():Promise.reject()).then(l=>{GLB=l;renderLB(l.findIndex(x=>x.n===e.n&&x.s===e.s))}).catch(()=>{})}
SV.onclick=saveScore;document.getElementById('sk').onclick=()=>{NF.classList.add('gone');B.classList.remove('gone');renderLB();clearTimeout(idle);idle=setTimeout(showStart,15000)};NM.onkeydown=e=>{if(e.key==='Enter')saveScore()};
NM.oninput=()=>{clearTimeout(idle);idle=setTimeout(showStart,45000)};
let taps=0,tapT;document.querySelector('#ui img').addEventListener('click',()=>{taps++;clearTimeout(tapT);tapT=setTimeout(()=>taps=0,1500);if(taps>=5){saveLB([]);renderLB();taps=0}});
renderLB();fetchGlobal();

function addGerm(){
  const big=Math.random()<.22,r=(big?40:26)*K;
  germs.push({x:r+Math.random()*(W-2*r),y:-r,r,hp:big?2:1,v:(big?75:115)+Math.random()*45+(TIME-left)*2.5,t:Math.random()*6,flash:0,big});
}
function fire(){
  const nx=wx,ny=gy()-172*K;
  for(let i=0;i<5;i++)mist.push({x:nx+(Math.random()-.5)*8,y:ny,vx:(Math.random()-.5)*90,vy:-(520+Math.random()*200),l:.5});
  let best=null;
  for(const o of germs)if(o.hp>0&&o.y<ny&&ny-o.y<520*K&&Math.abs(o.x-nx)<o.r+26*K&&(!best||o.y>best.y))best=o;
  if(best){best.hp--;best.flash=.2;
    if(best.hp<=0){score++;for(let i=0;i<12;i++)sparks.push({x:best.x,y:best.y,vx:(Math.random()-.5)*300,vy:(Math.random()-.5)*300,l:.55,c:i%2?'#e7b8ff':PK})}}
}
function setX(e){const r=cv.getBoundingClientRect();tx=Math.min(W-30,Math.max(30,e.clientX-r.left))}
cv.addEventListener('pointerdown',e=>{if(state!=='play')return;cv.setPointerCapture(e.pointerId);setX(e);spraying=true});
cv.addEventListener('pointermove',e=>{if(state==='play'&&(spraying||e.pointerType==='mouse'))setX(e)});
addEventListener('pointerup',()=>spraying=false);
addEventListener('pointercancel',()=>spraying=false);
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;keys[e.key]=1;if(e.key===' ')e.preventDefault()});
addEventListener('keyup',e=>keys[e.key]=0);

function drawGerm(o){
  const s=1+Math.sin(o.t*6)*.05;
  g.save();g.translate(o.x,o.y);g.scale(s,s);
  g.strokeStyle='#d9c24a';g.lineWidth=3;g.lineCap='round';
  for(let i=-1;i<=1;i++){g.beginPath();const x=i*o.r*.5;g.moveTo(x,-o.r-6);g.bezierCurveTo(x-7,-o.r-14,x+7,-o.r-20,x,-o.r-28);g.stroke()}
  g.fillStyle=o.flash>0?'#fff':(o.big?'#6f9a2c':'#8fb83c');
  for(let i=0;i<10;i++){const a=i*Math.PI/5;g.beginPath();g.arc(Math.cos(a)*o.r,Math.sin(a)*o.r,o.r*.2,0,7);g.fill()}
  g.beginPath();g.arc(0,0,o.r,0,7);g.fill();
  g.fillStyle='rgba(0,0,0,.12)';g.beginPath();g.arc(o.r*.4,o.r*.35,o.r*.16,0,7);g.arc(-o.r*.45,o.r*.45,o.r*.1,0,7);g.fill();
  g.fillStyle='#fff';g.beginPath();g.arc(-o.r*.32,-o.r*.1,o.r*.2,0,7);g.arc(o.r*.32,-o.r*.1,o.r*.2,0,7);g.fill();
  g.fillStyle='#2a1a33';g.beginPath();g.arc(-o.r*.32,-o.r*.06,o.r*.09,0,7);g.arc(o.r*.32,-o.r*.06,o.r*.09,0,7);g.fill();
  g.strokeStyle='#2a1a33';g.lineWidth=2.5;g.beginPath();g.moveTo(-o.r*.55,-o.r*.38);g.lineTo(-o.r*.12,-o.r*.26);g.moveTo(o.r*.55,-o.r*.38);g.lineTo(o.r*.12,-o.r*.26);g.stroke();
  g.beginPath();g.arc(0,o.r*.5,o.r*.2,Math.PI*1.1,Math.PI*1.9);g.stroke();
  if(o.hp>1){g.fillStyle=PK;g.fillRect(-o.r*.5,o.r+8,o.r,5)}
  g.restore();
}
function drawWoman(){
  g.save();g.translate(wx,gy());g.scale(face*K,K);
  const b=Math.sin(walk)*3,sw=Math.sin(walk)*6;
  g.fillStyle='#d9a07c';
  g.fillRect(-12+sw,-52,9,52);g.fillRect(3-sw,-52,9,52);
  g.fillStyle=P;g.fillRect(-14+sw,-6,13,6);g.fillRect(2-sw,-6,13,6);
  g.save();g.translate(0,b);
  g.fillStyle='#8a52a6';g.beginPath();g.moveTo(-17,-132);g.lineTo(17,-132);g.lineTo(30,-52);g.lineTo(-30,-52);g.closePath();g.fill();
  g.fillStyle=PK;g.fillRect(-19,-100,38,6);
  g.fillStyle='#d9a07c';g.fillRect(-4,-142,8,12);
  g.save();g.translate(-14,-126);g.rotate(.2+sw*.02);g.fillRect(-4,0,8,38);g.restore();
  g.save();g.translate(14,-126);g.rotate(-.5);g.fillRect(-4,0,8,34);g.restore();
  g.fillStyle='#fff';g.fillRect(25,-176,14,34);
  g.fillStyle=PK;g.fillRect(25,-182,14,8);g.fillRect(29,-188,6,6);
  g.fillStyle=P;g.fillRect(26,-168,12,14);
  g.fillStyle='#d9a07c';g.beginPath();g.arc(0,-158,19,0,7);g.fill();
  g.fillStyle='#3c2a45';g.beginPath();g.arc(0,-162,20,Math.PI*1.02,Math.PI*1.98);g.fill();
  g.beginPath();g.arc(-4,-186,11,0,7);g.fill();
  g.strokeStyle='#cfc6d6';g.lineWidth=3;g.beginPath();g.arc(0,-162,19,Math.PI*1.15,Math.PI*1.4);g.stroke();
  g.fillStyle='#2a1a33';g.beginPath();g.arc(5,-158,2,0,7);g.arc(13,-158,2,0,7);g.fill();
  g.strokeStyle='#b0505f';g.lineWidth=2;g.beginPath();g.arc(9,-151,5,.2,Math.PI-.2);g.stroke();
  g.restore();g.restore();
}
function frame(ts){
  const dt=Math.min((ts-last)/1000,.05);last=ts;
  let bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#e6d9f7');bg.addColorStop(1,'#faf6ff');
  g.fillStyle=bg;g.fillRect(0,0,W,H);
  g.fillStyle='#d9c8f0';g.fillRect(0,gy(),W,H-gy());
  g.fillStyle='rgba(95,55,110,.07)';
  for(const c of [[.15,.25,60],[.7,.18,80],[.45,.5,50],[.88,.55,70]]){g.beginPath();g.arc(c[0]*W,c[1]*H,c[2]*K,0,7);g.fill()}
  if(state==='play'){
    left-=dt;spawn-=dt;
    if(keys.ArrowLeft||keys.a)tx=Math.max(30,wx-400*dt*1.2);
    if(keys.ArrowRight||keys.d)tx=Math.min(W-30,wx+400*dt*1.2);
    cool-=dt;
    if((spraying||keys[' '])&&cool<=0){fire();cool=.16}
    const dx=tx-wx,st=Math.min(Math.abs(dx),420*dt)*Math.sign(dx);

    for(const o of germs){o.y+=o.v*dt;o.t+=dt;o.flash-=dt;if(o.hp>0&&o.y+o.r>=gy()){o.hp=0;lives--}}

  }

  for(const p of mist){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt;g.globalAlpha=Math.max(p.l*2,0);g.fillStyle='#d6a3ee';g.beginPath();g.arc(p.x,p.y,4+(.5-p.l)*14,0,7);g.fill()}

  g.textAlign='left';g.font="500 13px Poppins,system-ui,sans-serif";g.fillText('Killed',16,12);g.font="700 28px Poppins,system-ui,sans-serif";g.fillText(score,16,28);
